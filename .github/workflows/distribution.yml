name: Loop distribution
on:
  push:
    branches: [main, 'feat/cross-project-installer']
  pull_request:
permissions:
  contents: read
concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export reviewed source
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/loop-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: loop-source
          path: ${{ runner.temp }}/loop-source.tar.gz
          retention-days: 7
          if-no-files-found: error
