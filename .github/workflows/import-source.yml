name: Import exact tested Full Runtime source
on:
  push:
    branches: ['feat/full-runtime-mode-b']
    paths: ['.transport/**', '.github/workflows/import-source.yml']
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/feat/full-runtime-mode-b'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-runtime-mode-b
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify and materialize source archive
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          import hashlib, io, tarfile
          from pathlib import Path, PurePosixPath
          raw = b''.join(Path(f'.transport/part-{i}').read_bytes() for i in range(7))
          assert hashlib.sha256(raw).hexdigest() == 'c31f7d4548b524d1bad97f15816c148606baacb191bb9f6cf0966b15949e7670'
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:xz') as archive:
              members = archive.getmembers()
              assert len(members) == 69 and len({m.name for m in members}) == 69
              for member in members:
                  path = PurePosixPath(member.name)
                  assert member.isfile() and not path.is_absolute() and '..' not in path.parts
                  assert path.parts[0] not in ('.git', '.transport')
                  assert member.name != '.github/workflows/import-source.yml'
                  dest = Path(member.name)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(archive.extractfile(member).read())
                  dest.chmod(0o644)
          PY
          rm -rf -- .transport
          git add -A
          git update-index --force-remove .github/workflows/import-source.yml
          test "$(git write-tree)" = '2aa8b3dfda22db1ee01d0fc3f948e44b9a8f456e'
          git add .github/workflows/import-source.yml
      - name: Verify materialized source before publishing
        run: |
          python tools/check_skills.py
          python -m unittest discover -s tests -v
          python examples/demo.py --test-auto-approve
      - name: Commit only to the authorized feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: implement mode-B Full Runtime with evidence-gated exploration (#5)'
          git push origin HEAD:refs/heads/feat/full-runtime-mode-b
