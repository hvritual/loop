name: Loop quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: loop-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/loop.py lint
      - run: python scripts/demo.py
  upstream-compat:
    name: upstream-${{ matrix.runtime }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runtime: [codex, claude, opencode]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - run: python scripts/bootstrap.py --runtime ${{ matrix.runtime }}
      - run: python scripts/bootstrap.py --runtime ${{ matrix.runtime }} --doctor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-${{ matrix.runtime }}
          path: .loop-cache/install-*
          include-hidden-files: true
