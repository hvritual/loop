[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hvritual-loop-runtime"
version = "1.0.0"
description = "Mode-B intent-to-outcome runtime with evidence-gated exploration"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
loop-runtime = "loop_runtime.__main__:main"

[tool.setuptools.packages.find]
include = ["loop_runtime*"]
